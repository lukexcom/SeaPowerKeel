name: Release check

# Every Keel release is rebuilt here from its tag, with the same SDK (global.json) and the same pinned public references
# (tools/refs.ps1) as the developer's build. The run compares every program file with the release zip, checks them on
# VirusTotal, signs a build proof (GitHub artifact attestation) and writes the result into the release notes. A pull request
# only gets the build and its checksums, shown in the run's summary.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check again (e.g. v0.8.1)
        required: true
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest      # like the developer's PC: the checked-out line endings are part of the bytes
    permissions:
      contents: write            # writes the result into the release notes
      id-token: write            # signs the build proof
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the release folder from the public source
        shell: pwsh
        run: ./tools/package.ps1
      - name: Checksums of this build
        shell: pwsh
        run: python -I tools/release-check.py stage dist/SeaPowerKeel >> $env:GITHUB_STEP_SUMMARY
      - name: Compare with the release, VirusTotal, release notes
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}      # through env, never pasted into the script
        run: python -I tools/release-check.py verify $env:TAG dist/SeaPowerKeel
      - name: Signed build proof
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SeaPowerKeel/*.dll
            dist/SeaPowerKeel/*.exe
            dist/SeaPowerKeel/copy-to-BepInEx-plugins/*.dll
            dist/SeaPowerKeel/lib/*.bin
